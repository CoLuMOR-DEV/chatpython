<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --accent:#5b8cff; --text:#e8e9ed; --muted:#8a8f9c; --bubble-other:#232733; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         background:var(--bg); color:var(--text); display:flex; justify-content:center; height:100vh; }
  .app { width:100%; max-width:480px; display:flex; flex-direction:column; height:100%; }
  header { padding:14px 16px; background:var(--panel); border-bottom:1px solid #2a2f3a; font-size:0.9rem; color:var(--muted); }
  #messages { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:8px; }
  .msg { max-width:75%; padding:8px 12px; border-radius:14px; font-size:0.9rem; line-height:1.35; word-wrap:break-word; }
  .msg .who { font-size:0.7rem; color:var(--muted); margin-bottom:2px; }
  .msg.me { align-self:flex-end; background:var(--accent); color:white; border-bottom-right-radius:4px; }
  .msg.admin { align-self:flex-start; background:#3a2f23; border:1px solid #6b4a1f; border-bottom-left-radius:4px; }
  .msg.other { align-self:flex-start; background:var(--bubble-other); border-bottom-left-radius:4px; }
  .msg.system { align-self:center; color:var(--muted); font-size:0.75rem; background:none; padding:2px; }
  #composer { display:flex; gap:8px; padding:12px; background:var(--panel); border-top:1px solid #2a2f3a; }
  input { flex:1; padding:12px; border-radius:10px; border:1px solid #2a2f3a; background:#0f1115; color:var(--text); font-size:1rem; }
  button { padding:12px 18px; border:none; border-radius:10px; background:var(--accent); color:white; font-weight:600; cursor:pointer; }
  #nameGate { margin:auto; text-align:center; padding:24px; }
  #nameGate input { margin-bottom:10px; }
  #banner { display:none; background:#3a1f1f; color:#ffb4b4; text-align:center; padding:10px; font-size:0.85rem; }
</style>
</head>
<body>
<div class="app">
  <div id="banner"></div>
  <div id="nameGate">
    <p>Enter a display name to join this chat</p>
    <input id="nameInput" placeholder="Your name" maxlength="20">
    <button onclick="joinChat()">Join</button>
  </div>

  <div id="chatUI" style="display:none; flex-direction:column; height:100%;">
    <header>Temporary chat &mdash; nothing here is saved</header>
    <div id="messages"></div>
    <div id="composer">
      <input id="msgInput" placeholder="Type a message..." autocomplete="off">
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<script>
  const ROOM = "{{ room_hash }}";
  const socket = io();
  let myName = "";

  function joinChat() {
    const name = document.getElementById("nameInput").value.trim() || "Anonymous";
    myName = name;
    socket.emit("join", { room: ROOM, name });
    document.getElementById("nameGate").style.display = "none";
    document.getElementById("chatUI").style.display = "flex";
  }

  function sendMessage() {
    const input = document.getElementById("msgInput");
    const text = input.value.trim();
    if (!text) return;
    socket.emit("send_message", { room: ROOM, name: myName, text });
    input.value = "";
  }

  document.getElementById("msgInput")?.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendMessage();
  });

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, (c) => ({
      "&":"&amp;","<":"&lt;",">":"&gt;", '"':"&quot;","'":"&#39;"
    }[c]));
  }

  function addMessage(m) {
    const div = document.createElement("div");
    let cls = "other";
    if (m.who === myName) cls = "me";
    else if (m.who === "Admin") cls = "admin";
    else if (m.who === "System") cls = "system";
    div.className = "msg " + cls;
    if (cls !== "system") {
      div.innerHTML = `<div class="who">${escapeHtml(m.who)} &middot; ${m.ts}</div>${escapeHtml(m.text)}`;
    } else {
      div.textContent = m.text;
    }
    document.getElementById("messages").appendChild(div);
    document.getElementById("messages").scrollTop = 999999;
  }

  socket.on("history", (msgs) => msgs.forEach(addMessage));
  socket.on("message", addMessage);

  socket.on("gone", () => {
    const b = document.getElementById("banner");
    b.style.display = "block";
    b.textContent = "This chat has been closed by the admin. It's no longer available.";
    document.getElementById("composer").style.display = "none";
  });
</script>
</body>
</html>
