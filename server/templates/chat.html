<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Chat</title>
<style>
  :root {
    --bg:#0f1115; --panel:#171a21; --accent:#5b8cff; --text:#e8e9ed;
    --muted:#8a8f9c; --bubble-other:#232733;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--text); display:flex; justify-content:center;
    min-height: 100dvh;
  }
  .app {
    width:100%; max-width:560px; display:flex; flex-direction:column;
    height:100dvh;
  }
  header {
    padding:14px 16px; background:var(--panel); border-bottom:1px solid #2a2f3a;
    font-size:0.9rem; color:var(--muted); flex-shrink:0;
  }
  #messages {
    flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column;
    gap:8px; -webkit-overflow-scrolling: touch;
  }
  .msg { max-width:80%; padding:8px 12px; border-radius:14px; font-size:0.95rem; line-height:1.35; word-wrap:break-word; overflow-wrap:anywhere; }
  .msg .who { font-size:0.7rem; color:var(--muted); margin-bottom:2px; }
  .msg.me { align-self:flex-end; background:var(--accent); color:white; border-bottom-right-radius:4px; }
  .msg.admin { align-self:flex-start; background:#3a2f23; border:1px solid #6b4a1f; border-bottom-left-radius:4px; }
  .msg.other { align-self:flex-start; background:var(--bubble-other); border-bottom-left-radius:4px; }
  .msg.system { align-self:center; color:var(--muted); font-size:0.75rem; background:none; padding:2px; }
  #composer {
    display:flex; gap:8px; padding:12px; background:var(--panel);
    border-top:1px solid #2a2f3a; flex-shrink:0;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
  }
  input {
    flex:1; padding:12px; border-radius:10px; border:1px solid #2a2f3a;
    background:#0f1115; color:var(--text); font-size:16px; min-width:0;
  }
  button {
    padding:12px 18px; border:none; border-radius:10px; background:var(--accent);
    color:white; font-weight:600; cursor:pointer; min-height:44px; font-size:1rem;
  }
  button:active { opacity:0.85; }
  #nameGate { margin:auto; text-align:center; padding:24px; width:100%; max-width:360px; }
  #nameGate p { font-size:1rem; }
  #nameGate input { margin-bottom:10px; width:100%; }
  #nameGate button { width:100%; }
  #banner { display:none; background:#3a1f1f; color:#ffb4b4; text-align:center; padding:10px; font-size:0.85rem; flex-shrink:0; }

  /* Tablet / desktop: give the chat some breathing room instead of an
     edge-to-edge phone-width column. */
  @media (min-width: 700px) {
    body { padding: 24px 0; }
    .app {
      max-width: 720px;
      height: calc(100dvh - 48px);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.45);
      border: 1px solid #232733;
    }
    .msg { max-width: 65%; }
  }

  @media (min-width: 1100px) {
    .app { max-width: 820px; }
  }
</style>
</head>
<body>
<div class="app">
  <div id="banner"></div>
  <div id="nameGate">
    <p>Enter a display name to join this chat</p>
    <input id="nameInput" placeholder="Your name" maxlength="20">
    <button onclick="joinChat()">Join</button>
  </div>

  <div id="chatUI" style="display:none; flex-direction:column; height:100%;">
    <header>Temporary chat &mdash; nothing here is saved</header>
    <div id="messages"></div>
    <div id="composer">
      <input id="msgInput" placeholder="Type a message..." autocomplete="off">
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<script>
  const ROOM = "{{ room_hash }}";
  const socket = io();
  let myName = "";

  // ---------------------------------------------------------------------
  // Notifications: a short beep + a flashing tab title while the tab is
  // not focused / not visible, for incoming messages from other people.
  // ---------------------------------------------------------------------
  const ORIGINAL_TITLE = document.title;
  let audioCtx = null;
  let flashTimer = null;
  let flashOn = false;

  function unlockAudio() {
    // Browsers require a user gesture before audio can play. The Join
    // button click counts, so we set this up right there.
    if (!audioCtx) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (Ctx) audioCtx = new Ctx();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  }

  function playNotificationSound() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = "sine";
    osc.frequency.setValueAtTime(880, now);
    osc.frequency.setValueAtTime(660, now + 0.12);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.25, now + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.35);
    osc.start(now);
    osc.stop(now + 0.35);
  }

  function isTabActive() {
    return document.visibilityState === "visible" && document.hasFocus();
  }

  function startTitleFlash() {
    if (flashTimer) return;
    flashTimer = setInterval(() => {
      document.title = flashOn ? ORIGINAL_TITLE : "New message!";
      flashOn = !flashOn;
    }, 1000);
  }

  function stopTitleFlash() {
    if (flashTimer) {
      clearInterval(flashTimer);
      flashTimer = null;
    }
    flashOn = false;
    document.title = ORIGINAL_TITLE;
  }

  document.addEventListener("visibilitychange", () => { if (isTabActive()) stopTitleFlash(); });
  window.addEventListener("focus", stopTitleFlash);

  function notifyIncoming() {
    playNotificationSound();
    startTitleFlash();
  }

  // ---------------------------------------------------------------------
  // Chat logic
  // ---------------------------------------------------------------------
  function joinChat() {
    const name = document.getElementById("nameInput").value.trim() || "Anonymous";
    myName = name;
    unlockAudio();
    socket.emit("join", { room: ROOM, name });
    document.getElementById("nameGate").style.display = "none";
    document.getElementById("chatUI").style.display = "flex";
    document.getElementById("msgInput").focus();
  }

  function sendMessage() {
    const input = document.getElementById("msgInput");
    const text = input.value.trim();
    if (!text) return;
    socket.emit("send_message", { room: ROOM, name: myName, text });
    input.value = "";
  }

  document.getElementById("msgInput")?.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendMessage();
  });

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, (c) => ({
      "&":"&amp;","<":"&lt;",">":"&gt;", '"':"&quot;","'":"&#39;"
    }[c]));
  }

  function addMessage(m, { fromHistory = false } = {}) {
    const div = document.createElement("div");
    let cls = "other";
    if (m.who === myName) cls = "me";
    else if (m.who === "Admin") cls = "admin";
    else if (m.who === "System") cls = "system";
    div.className = "msg " + cls;
    if (cls !== "system") {
      div.innerHTML = `<div class="who">${escapeHtml(m.who)} &middot; ${m.ts}</div>${escapeHtml(m.text)}`;
    } else {
      div.textContent = m.text;
    }
    document.getElementById("messages").appendChild(div);
    document.getElementById("messages").scrollTop = 999999;

    if (!fromHistory && cls !== "me" && cls !== "system" && !isTabActive()) {
      notifyIncoming();
    }
  }

  socket.on("history", (msgs) => msgs.forEach((m) => addMessage(m, { fromHistory: true })));
  socket.on("message", (m) => addMessage(m));

  socket.on("gone", () => {
    stopTitleFlash();
    const b = document.getElementById("banner");
    b.style.display = "block";
    b.textContent = "This chat has been closed by the admin. It's no longer available.";
    document.getElementById("composer").style.display = "none";
  });
</script>
</body>
</html>
